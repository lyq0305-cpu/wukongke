var LEADER_PASSWORD = 'wkq2leader2026';

// ========== LOCAL STORAGE ==========
function lsGet(key) { try { return JSON.parse(localStorage.getItem('wkq2eval_' + key) || 'null'); } catch(e) { return null; } }
function lsSet(key, val) { localStorage.setItem('wkq2eval_' + key, JSON.stringify(val)); }

function getAllMembers() {
  var custom = lsGet('customMembers') || [];
  return PRESET_MEMBERS.concat(custom);
}

function getAllScores() {
  return lsGet('scores') || {};
}

function saveScore(scoreObj) {
  var scores = getAllScores();
  var eid = scoreObj.evaluatorId;
  var rid = scoreObj.reportId;
  if (!scores[eid]) scores[eid] = {};
  scores[eid][rid] = { total: scoreObj.d1+scoreObj.d2+scoreObj.d3+scoreObj.d4, d1:scoreObj.d1, d2:scoreObj.d2, d3:scoreObj.d3, d4:scoreObj.d4, d1_comment:scoreObj.d1_comment||'', d2_comment:scoreObj.d2_comment||'', d3_comment:scoreObj.d3_comment||'', d4_comment:scoreObj.d4_comment||'', timestamp: Date.now() };
  lsSet('scores', scores);
}

function deleteScoreFromLS(evaluatorId, reportId) {
  var scores = getAllScores();
  if (scores[evaluatorId] && scores[evaluatorId][reportId]) {
    delete scores[evaluatorId][reportId];
    if (Object.keys(scores[evaluatorId]).length === 0) delete scores[evaluatorId];
  }
  lsSet('scores', scores);
}

function getCustomMembers() { return lsGet('customMembers') || []; }
function getNextCustomId() { var cm = getCustomMembers(); var maxId = 99; cm.forEach(function(m){ if(m.id > maxId) maxId = m.id; }); return maxId + 1; }

function addCustomMember(name) {
  var cm = getCustomMembers();
  var existing = getAllMembers().find(function(m){ return m.name === name; });
  if (existing) return { success: true, member: existing, message: '已存在' };
  var newMember = { id: getNextCustomId(), name: name, category: '其他' };
  cm.push(newMember);
  lsSet('customMembers', cm);
  return { success: true, member: newMember };
}

function deleteCustomMemberFromLS(memberId) {
  var cm = getCustomMembers();
  cm = cm.filter(function(m){ return m.id !== memberId; });
  lsSet('customMembers', cm);
  // Also delete all scores by/from this member
  var scores = getAllScores();
  delete scores[memberId]; // scores given by this member
  // Delete scores received by this member on their reports
  Object.keys(scores).forEach(function(eid) {
    Object.keys(scores[eid]).forEach(function(rid) {
      var report = REPORTS.find(function(r){ return r.id === parseInt(rid); });
      if (report && report.memberId === memberId) delete scores[eid][rid];
    });
  });
  lsSet('scores', scores);
}

// ========== STATE ==========
var currentUser = null;
var selectedId = null;
var isLeaderSelected = false;
var leaderPassword = '';
var membersData = getAllMembers();
var reportsData = REPORTS;
var dimensionsData = DIMENSIONS;

// ========== INIT ==========
function initApp() {
  membersData = getAllMembers();
  initLogin();
}

// ========== LOGIN ==========
function initLogin() {
  var grid = document.getElementById('nameGrid');
  grid.innerHTML = '';
  var loginSub = document.getElementById('loginSub');
  if (loginSub) loginSub.textContent = '2026年第二季度 · ' + REPORTS.length + '份复盘报告 · 请选择您的身份进入评分';
  var presetMembers = membersData.filter(function(m) { return m.id < 100; });
  presetMembers.forEach(function(m) {
    var card = document.createElement('div');
    card.className = 'name-card';
    card.setAttribute('data-id', m.id);
    card.innerHTML = '<div class="nc-name">' + m.name + '</div><div class="nc-cat">' + m.category + '</div>';
    card.onclick = function() { selectMember(m.id); };
    grid.appendChild(card);
  });
  renderCustomMembersOnLogin();
}

function renderCustomMembersOnLogin() {
  membersData = getAllMembers();
  var customList = membersData.filter(function(m) { return m.id >= 100; });
  var section = document.getElementById('customMembersSection');
  var listEl = document.getElementById('customMembersList');
  if (customList.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  listEl.innerHTML = '';
  customList.forEach(function(m) {
    var item = document.createElement('div');
    item.className = 'custom-member-item' + (selectedId === m.id ? ' selected' : '');
    item.setAttribute('data-id', m.id);
    item.innerHTML = '<span class="cmi-name" onclick="selectMember(' + m.id + ')">' + m.name + '</span>' +
      '<span style="color:#888;font-size:12px;">(' + m.category + ')</span>' +
      '<button class="custom-member-del" onclick="deleteCustomMemberFromLogin(event,' + m.id + ')">删除</button>';
    listEl.appendChild(item);
  });
}

function deleteCustomMemberFromLogin(event, memberId) {
  if (event) event.stopPropagation();
  if (!confirm('确认删除该成员？其评分数据也将删除！')) return;
  deleteCustomMemberFromLS(memberId);
  membersData = getAllMembers();
  renderCustomMembersOnLogin();
  showToast('已删除');
}

function selectMember(id) {
  selectedId = id;
  isLeaderSelected = false;
  document.querySelectorAll('.name-card').forEach(function(c) {
    c.classList.toggle('selected', parseInt(c.getAttribute('data-id')) === id);
  });
  document.querySelectorAll('.custom-member-item').forEach(function(c) {
    c.classList.toggle('selected', parseInt(c.getAttribute('data-id')) === id);
  });
  document.getElementById('leaderCard').classList.remove('selected');
  var m = membersData.find(function(m) { return m.id === id; });
  var confirmEl = document.getElementById('confirmName');
  confirmEl.textContent = '已选择：' + m.name + '(' + m.category + ')';
  confirmEl.classList.add('visible');
  document.getElementById('enterBtn').classList.add('visible');
}

function selectLeader() {
  isLeaderSelected = true; selectedId = null;
  document.querySelectorAll('.name-card').forEach(function(c) { c.classList.remove('selected'); });
  document.getElementById('leaderCard').classList.add('selected');
  document.getElementById('pwdModal').classList.add('show');
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdError').classList.remove('show');
  document.getElementById('pwdInput').focus();
}

function registerCustomName() {
  var nameInput = document.getElementById('customNameInput');
  var name = (nameInput.value || '').trim();
  var hintEl = document.getElementById('customNameHint');
  if (!name) { hintEl.textContent = '请输入您的姓名'; hintEl.className = 'custom-name-hint error'; return; }
  var res = addCustomMember(name);
  if (res.success) {
    membersData = getAllMembers();
    currentUser = { id: res.member.id, name: res.member.name, isLeader: false };
    hintEl.textContent = '注册成功！'; hintEl.className = 'custom-name-hint success';
    enterApp();
  }
}

function cancelLeader() {
  document.getElementById('pwdModal').classList.remove('show');
  isLeaderSelected = false; selectedId = null;
  document.getElementById('leaderCard').classList.remove('selected');
  document.getElementById('confirmName').classList.remove('visible');
  document.getElementById('enterBtn').classList.remove('visible');
}

function verifyLeader() {
  var pwd = document.getElementById('pwdInput').value;
  if (pwd === LEADER_PASSWORD) {
    leaderPassword = pwd;
    document.getElementById('pwdModal').classList.remove('show');
    currentUser = { id:0, name:'科室领导', isLeader:true };
    enterApp();
  } else {
    document.getElementById('pwdError').classList.add('show');
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

function doLogin() {
  if (isLeaderSelected) {
    if (!leaderPassword) { selectLeader(); return; }
    currentUser = { id:0, name:'科室领导', isLeader:true };
  } else if (selectedId) {
    var m = membersData.find(function(m) { return m.id === selectedId; });
    currentUser = { id:m.id, name:m.name, isLeader:false };
  } else { showToast('请先选择身份', 'error'); return; }
  enterApp();
}

function enterApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('userBadge').textContent = currentUser.name;
  document.getElementById('exportBtn').style.display = 'inline-block';
  if (currentUser.isLeader) {
    document.getElementById('memberTabs').style.display = 'none';
    document.getElementById('leaderTabs').style.display = 'flex';
    renderLeaderView('matrix');
  } else {
    document.getElementById('memberTabs').style.display = 'flex';
    document.getElementById('leaderTabs').style.display = 'none';
    renderEvaluateView();
  }
}

function doLogout() {
  currentUser = null; selectedId = null; isLeaderSelected = false;
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('exportBtn').style.display = 'none';
  document.querySelectorAll('.name-card').forEach(function(c) { c.classList.remove('selected'); });
  document.getElementById('leaderCard').classList.remove('selected');
  document.getElementById('confirmName').classList.remove('visible');
  document.getElementById('enterBtn').classList.remove('visible');
}

// ========== TAB SWITCHING ==========
function switchTab(tab) {
  document.querySelectorAll('#memberTabs .tab-btn').forEach(function(b) { b.classList.remove('active'); });
  var btns = document.querySelectorAll('#memberTabs .tab-btn');
  if (tab === 'evaluate') { btns[0].classList.add('active'); renderEvaluateView(); }
}

function switchLeaderTab(tab) {
  document.querySelectorAll('#leaderTabs .tab-btn').forEach(function(b) { b.classList.remove('active'); });
  var btns = document.querySelectorAll('#leaderTabs .tab-btn');
  if (tab === 'matrix') { btns[0].classList.add('active'); renderLeaderView('matrix'); }
  else if (tab === 'ranking') { btns[1].classList.add('active'); renderLeaderView('ranking'); }
  else if (tab === 'members') { btns[2].classList.add('active'); renderLeaderView('members'); }
}

// ========== EVALUATE VIEW ==========
function renderEvaluateView() {
  membersData = getAllMembers();
  var scores = getAllScores();
  var myScores = scores[currentUser.id] || {};
  var doneCount = 0;
  var evaluableReports = reportsData.filter(function(r) { return r.memberId !== currentUser.id; });
  evaluableReports.forEach(function(r) { if (myScores[r.id]) doneCount++; });
  var totalEvaluable = evaluableReports.length;

  var html = '<div class="progress-card"><div class="progress-bar-wrap">' +
    '<div class="label">评分进度(需评 ' + totalEvaluable + ' 份，已评 ' + doneCount + ' 份)</div>' +
    '<div class="progress-bar"><div class="fill" style="width:' + (totalEvaluable>0?(doneCount/totalEvaluable*100):0) + '%"></div></div></div>' +
    '<div class="progress-stats"><div class="big">' + doneCount + '/' + totalEvaluable + '</div><div>已完成</div></div></div>' +
    '<div class="filter-bar"><span class="filter-label">筛选：</span>' +
    '<select id="filterMember" onchange="applyFilter()"><option value="">全部人员</option>' +
    membersData.filter(function(m){return m.id!==currentUser.id}).map(function(m){return '<option value="'+m.id+'">'+m.name+'('+m.category+')</option>';}).join("") +
    '</select><select id="filterStatus" onchange="applyFilter()"><option value="">全部状态</option><option value="done">已评分</option><option value="pending">未评分</option></select></div>' +
    '<div class="report-list" id="reportList">';

  evaluableReports.forEach(function(r) {
    var score = myScores[r.id];
    var isDone = !!score;
    html += '<div class="report-item" data-member="' + r.memberId + '" data-status="' + (isDone?'done':'pending') + '" onclick="openEvalModal(' + r.id + ')">' +
      '<div class="ri-status ' + (isDone?'done':'pending') + '">' + (isDone?'✓':'—') + '</div>' +
      '<div class="ri-body"><div class="ri-title">' + r.title + '</div>' +
      '<div class="ri-meta">' + r.reviewer + ' · ' + r.category + ' · ' + r.date + ' · ' + r.type + '</div></div>' +
      '<div class="ri-score">' + (isDone?score.total+'分':'未评') + '</div></div>';
  });

  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

function applyFilter() {
  var member = document.getElementById('filterMember').value;
  var status = document.getElementById('filterStatus').value;
  document.querySelectorAll('.report-item').forEach(function(item) {
    var show = true;
    if (member && item.getAttribute('data-member') !== member) show = false;
    if (status && item.getAttribute('data-status') !== status) show = false;
    item.style.display = show ? 'flex' : 'none';
  });
}

function showReportDetail(reportId) {
  var r = reportsData.find(function(r) { return r.id === reportId; });
  if (!r || !r.fullContent) { showToast('暂无完整内容', 'error'); return; }
  var content = r.fullContent.replace(/\n/g, '<br>');
  var html = '<div class="modal-header"><h3>' + r.reviewer + ' · ' + r.category + ' · ' + r.date + '</h3><button class="modal-close" onclick="closeDetailModal()">✕</button></div>' +
    '<div class="modal-body detail-body"><div class="detail-meta"><span class="tag">' + r.type + '</span></div>' +
    '<div class="detail-content">' + content + '</div></div>';
  document.getElementById('detailModalCard').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetailModal() { document.getElementById('detailModal').classList.remove('show'); }

// ========== EVAL MODAL ==========
var currentReportId = null;

function openEvalModal(reportId) {
  currentReportId = reportId;
  var r = reportsData.find(function(r) { return r.id === reportId; });
  var scores = getAllScores();
  var existing = (scores[currentUser.id] && scores[currentUser.id][reportId]) || null;
  var total = existing ? existing.total : null;

  var html = '<div class="modal-header"><h3>评分：' + r.reviewer + ' 的复盘报告</h3><button class="modal-close" onclick="closeEvalModal()">✕</button></div>' +
    '<div class="modal-body"><div class="report-summary">' +
    '<div class="rs-meta">' + r.reviewer + ' · ' + r.category + ' · ' + r.date + '</div>' +
    '<div class="rs-title">' + r.title + '</div>' +
    '<div class="rs-desc">' + r.summary + '</div>' +
    '<div class="rs-tags"><span class="tag">' + r.type + '</span>' +
    '<button class="btn-text" onclick="showReportDetail(' + r.id + ')">查看完整报告内容</button></div></div>';

  dimensionsData.forEach(function(dim) {
    var val = existing ? existing[dim.key] : null;
    html += '<div class="score-dimension">' +
      '<div class="sd-title"><span>' + dim.name + '</span><span class="sd-weight">' + dim.weight + '</span></div>' +
      '<div class="sd-desc">' + dim.desc + '</div><div class="sd-options">';
    for (var i = 0; i <= dim.max; i++) {
      html += '<div class="opt"><input type="radio" name="' + dim.key + '" id="' + dim.key + '_' + i + '" value="' + i + '"' + (val===i?' checked':'') + '>' +
        '<label for="' + dim.key + '_' + i + '">' + i + '</label></div>';
    }
    html += '</div><div class="sd-comment"><textarea id="comment_' + dim.key + '" placeholder="简短评语(可选)">' + (existing && existing[dim.key+'_comment'] ? existing[dim.key+'_comment'] : '') + '</textarea></div></div>';
  });

  html += '</div><div class="modal-footer">' +
    '<div class="mf-score">本次评分：<span class="val" id="modalTotalScore">' + (total!==null?total:'—') + '</span> / 20 分</div>' +
    '<div class="mf-btns">' +
    (existing ? '<button class="btn btn-danger" onclick="deleteEval()">删除评分</button>' : '') +
    '<button class="btn btn-secondary" onclick="closeEvalModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="saveEval()">' + (existing?'修改评分':'保存评分') + '</button></div></div>';

  document.getElementById('evalModalCard').innerHTML = html;
  document.getElementById('evalModal').classList.add('show');

  document.querySelectorAll('#evalModalCard input[type=radio]').forEach(function(inp) {
    inp.addEventListener('change', updateModalTotal);
  });
}

function updateModalTotal() {
  var total = 0;
  document.querySelectorAll('#evalModalCard input[type=radio]:checked').forEach(function(r) { total += parseInt(r.value); });
  document.getElementById('modalTotalScore').textContent = total;
}

function saveEval() {
  var scoreObj = { evaluatorId: currentUser.id, reportId: currentReportId };
  var total = 0;
  var allSelected = true;

  dimensionsData.forEach(function(dim) {
    var checked = document.querySelector('#evalModalCard input[name="' + dim.key + '"]:checked');
    if (!checked) { allSelected = false; }
    else { scoreObj[dim.key] = parseInt(checked.value); total += parseInt(checked.value); }
    scoreObj[dim.key + '_comment'] = document.getElementById('comment_' + dim.key).value;
  });

  if (!allSelected) { showToast('请为所有维度打分', 'error'); return; }

  // Check self-scoring
  var report = reportsData.find(function(r) { return r.id === currentReportId; });
  if (report && report.memberId === currentUser.id) { showToast('不能给自己的报告评分', 'error'); return; }

  saveScore(scoreObj);
  closeEvalModal();
  renderEvaluateView();
  showToast('评分已保存！本报告得分 ' + total + ' / 20 分');
}

function closeEvalModal() { document.getElementById('evalModal').classList.remove('show'); }

function deleteEval() {
  if (!currentReportId) return;
  if (!confirm('确认删除此评分？')) return;
  deleteScoreFromLS(currentUser.id, currentReportId);
  closeEvalModal();
  renderEvaluateView();
  showToast('评分已删除');
}

// ========== MY SCORES ==========
function renderMyScores() {
  var scores = getAllScores();
  var myReports = reportsData.filter(function(r) { return r.memberId === currentUser.id; });
  var totalReceived = 0, evaluatorCount = 0;

  myReports.forEach(function(r) {
    Object.keys(scores).forEach(function(eid) {
      if (parseInt(eid) === currentUser.id) return;
      var s = scores[eid] && scores[eid][r.id];
      if (s) { totalReceived += s.total; evaluatorCount++; }
    });
  });

  var avgPerReport = evaluatorCount > 0 ? totalReceived / evaluatorCount : 0;
  var overallScore = myReports.length > 0 ? (avgPerReport / 20 * 100) : 0;

  var html = '<div class="my-scores-hero">' +
    '<div class="ms-label">我的 Q2 综合评分(满分 100)</div>' +
    '<div class="ms-val">' + (evaluatorCount>0?overallScore.toFixed(1):'—') + '<span class="ms-max"> / 100</span></div>' +
    '<div class="ms-sub">基于 ' + evaluatorCount + ' 人次评分 · ' + myReports.length + ' 份报告 · 每份满分 20 分</div></div>';

  if (evaluatorCount === 0) {
    html += '<div style="text-align:center;color:#888;padding:40px;">尚无他人对您的报告评分。多人在同一设备上轮流评分后，此处将显示综合得分。</div>';
  }

  myReports.forEach(function(r) {
    var evals = [];
    Object.keys(scores).forEach(function(eid) {
      if (parseInt(eid) === currentUser.id) return;
      var s = scores[eid] && scores[eid][r.id];
      if (s) evals.push({ evaluatorId: parseInt(eid), score: s });
    });
    var avgTotal = evals.length > 0 ? evals.reduce(function(s,e){return s+e.score.total},0)/evals.length : 0;
    var avgD1 = evals.length>0 ? evals.reduce(function(s,e){return s+e.score.d1},0)/evals.length : 0;
    var avgD2 = evals.length>0 ? evals.reduce(function(s,e){return s+e.score.d2},0)/evals.length : 0;
    var avgD3 = evals.length>0 ? evals.reduce(function(s,e){return s+e.score.d3},0)/evals.length : 0;
    var avgD4 = evals.length>0 ? evals.reduce(function(s,e){return s+e.score.d4},0)/evals.length : 0;

    html += '<div class="my-report-card"><div class="mrc-title">' + r.title + '</div>' +
      '<div class="mrc-meta">' + r.date + ' · ' + r.type + ' · 已获 ' + evals.length + ' 人评分</div>' +
      '<div class="mrc-dims">' +
      '<div class="mrc-dim"><span class="dim-name">事件描述</span><span class="dim-val">' + (evals.length>0?avgD1.toFixed(1):'—') + '<span class="dim-max">/5</span></span></div>' +
      '<div class="mrc-dim"><span class="dim-name">根因分析</span><span class="dim-val">' + (evals.length>0?avgD2.toFixed(1):'—') + '<span class="dim-max">/5</span></span></div>' +
      '<div class="mrc-dim"><span class="dim-name">解决方案</span><span class="dim-val">' + (evals.length>0?avgD3.toFixed(1):'—') + '<span class="dim-max">/5</span></span></div>' +
      '<div class="mrc-dim"><span class="dim-name">经验沉淀</span><span class="dim-val">' + (evals.length>0?avgD4.toFixed(1):'—') + '<span class="dim-max">/5</span></span></div></div>' +
      '<div class="mrc-total"><span class="total-label">本报告平均得分</span><span class="total-val">' + (evals.length>0?avgTotal.toFixed(1):'—') + '<span class="total-max"> / 20</span></span></div></div>';
  });

  document.getElementById('mainContent').innerHTML = html;
}

// ========== LEADER VIEW ==========
function renderLeaderView(mode) {
  membersData = getAllMembers();
  var scores = getAllScores();

  if (mode === 'matrix') renderLeaderMatrix(scores);
  else if (mode === 'ranking') renderLeaderRanking(scores);
  else if (mode === 'members') renderLeaderMembers();
}

function renderLeaderMatrix(scores) {
  var totalReports = reportsData.length;
  var totalMembers = membersData.length;
  var evaluators = Object.keys(scores).filter(function(eid) { return Object.keys(scores[eid]).length > 0; }).length;
  var totalEvaluations = 0;
  Object.keys(scores).forEach(function(eid) { totalEvaluations += Object.keys(scores[eid]).length; });

  var html = '<div class="leader-summary">' +
    '<div class="ls-stat"><div class="ls-val">' + totalReports + '</div><div class="ls-label">复盘报告</div></div>' +
    '<div class="ls-stat"><div class="ls-val">' + totalMembers + '</div><div class="ls-label">参评人员</div></div>' +
    '<div class="ls-stat"><div class="ls-val">' + evaluators + '</div><div class="ls-label">已参评人数</div></div>' +
    '<div class="ls-stat"><div class="ls-val">' + totalEvaluations + '</div><div class="ls-label">已评次数</div></div></div>' +
    '<div class="matrix-wrap"><table class="matrix-table"><thead><tr>' +
    '<th style="text-align:left;min-width:180px;">报告</th>' +
    membersData.map(function(m){return '<th>' + m.name + '</th>';}).join("") +
    '<th style="background:#2e7d32;">平均</th></tr></thead><tbody>';

  reportsData.forEach(function(r) {
    var rowScores = [];
    var rowHtml = '<td class="row-header">' + r.reviewer + ' · ' + r.date + '</td>';
    membersData.forEach(function(m) {
      if (m.id === r.memberId) { rowHtml += '<td class="cell-na">—</td>'; }
      else {
        var s = scores[m.id] && scores[m.id][r.id] ? scores[m.id][r.id] : null;
        if (s) { rowScores.push(s.total); rowHtml += '<td class="cell-score">' + s.total + '</td>'; }
        else { rowHtml += '<td style="color:#ccc;">—</td>'; }
      }
    });
    var avg = rowScores.length>0 ? (rowScores.reduce(function(a,b){return a+b},0)/rowScores.length).toFixed(1) : '—';
    rowHtml += '<td class="cell-avg">' + avg + '</td>';
    html += '<tr>' + rowHtml + '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('mainContent').innerHTML = html;
}

function renderLeaderRanking(scores) {
  var memberScores = membersData.map(function(m) {
    var myReports = reportsData.filter(function(r) { return r.memberId === m.id; });
    var totalReceived = 0, evalCount = 0;
    membersData.forEach(function(evaluator) {
      if (evaluator.id === m.id) return;
      myReports.forEach(function(r) {
        var s = scores[evaluator.id] && scores[evaluator.id][r.id] ? scores[evaluator.id][r.id] : null;
        if (s) { totalReceived += s.total; evalCount++; }
      });
    });
    var avgPerReport = evalCount > 0 ? totalReceived / evalCount : 0;
    return { member:m, evalCount:evalCount, overallScore: evalCount>0 ? (avgPerReport/20*100) : null };
  });

  memberScores.sort(function(a,b) {
    if (a.overallScore === null) return 1; if (b.overallScore === null) return -1;
    return b.overallScore - a.overallScore;
  });

  var html = '<div style="background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden;">' +
    '<table class="matrix-table"><thead><tr><th>排名</th><th style="text-align:left;">姓名</th><th style="text-align:left;">类别</th><th>评分人次</th><th>综合评分</th></tr></thead><tbody>';

  memberScores.forEach(function(ms, idx) {
    var medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
    var isCustom = ms.member.id >= 100;
    var nameDisplay = ms.member.name + (isCustom ? ' <span style="font-size:11px;color:var(--warning);background:var(--warning-bg);padding:1px 6px;border-radius:3px;">新增</span>' : '');
    html += '<tr><td style="font-weight:700;">' + (ms.overallScore!==null?(idx+1):'—') + ' ' + medal + '</td>' +
      '<td class="row-header">' + nameDisplay + '</td>' +
      '<td style="text-align:left;color:#888;">' + ms.member.category + '</td>' +
      '<td>' + ms.evalCount + '</td>' +
      '<td class="cell-score" style="font-size:16px;">' + (ms.overallScore!==null?ms.overallScore.toFixed(1):'—') + '</td></tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('mainContent').innerHTML = html;
}

function renderLeaderMembers() {
  var allMembers = getAllMembers();
  var customList = allMembers.filter(function(m) { return m.id >= 100; });

  var html = '<h3 style="margin-bottom:16px;color:var(--primary);">成员管理</h3>' +
    '<div style="background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow);">' +
    '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">预设成员(不可删除)</div>' +
    '<div style="font-size:13px;color:var(--gray-500);">共 ' + (allMembers.length - customList.length) + ' 人</div></div>';

  if (customList.length > 0) {
    html += '<div style="background:#fff;border-radius:10px;padding:16px 20px;box-shadow:var(--shadow);">' +
      '<div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--warning);">自定义注册成员(可删除)</div>' +
      '<table class="matrix-table"><thead><tr><th style="text-align:left;">姓名</th><th>类别</th><th>操作</th></tr></thead><tbody>';
    customList.forEach(function(m) {
      html += '<tr><td class="row-header">' + m.name + '</td><td style="color:#888;">' + m.category + '</td>' +
        '<td><button style="background:var(--danger);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;" onclick="deleteCustomMemberLeader(' + m.id + ')">删除</button></td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div style="text-align:center;color:#888;padding:40px;background:#fff;border-radius:10px;">暂无自定义注册成员</div>';
  }

  document.getElementById('mainContent').innerHTML = html;
}

function deleteCustomMemberLeader(memberId) {
  if (!confirm('确认删除该成员及其评分数据？')) return;
  deleteCustomMemberFromLS(memberId);
  membersData = getAllMembers();
  renderLeaderMembers();
  showToast('已删除');
}

// ========== EXPORT ==========
function exportDocument() {
  showToast('正在生成文档...');
  var scores = getAllScores();
  var allMembers = getAllMembers();
  var isLeader = currentUser && currentUser.isLeader;
  generateDoc(isLeader, scores, allMembers);
}

function generateDoc(isLeader, scores, allMembers) {
  var now = new Date();
  var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';

  var memberScores = [];
  allMembers.forEach(function(member) {
    var reportsForMember = reportsData.filter(function(r) { return r.memberId === member.id; });
    var totalScore = 0, totalWeight = 0, evaluatorsCount = 0;
    var dimScores = { d1:0, d2:0, d3:0, d4:0 };
    var dimCounts = { d1:0, d2:0, d3:0, d4:0 };

    reportsForMember.forEach(function(report) {
      var reportTotal = 0, reportEvals = 0;
      Object.keys(scores).forEach(function(eid) {
        if (parseInt(eid) === member.id) return;
        var s = scores[eid] && scores[eid][report.id];
        if (s) { reportTotal += s.total; reportEvals++; dimScores.d1+=s.d1; dimScores.d2+=s.d2; dimScores.d3+=s.d3; dimScores.d4+=s.d4; dimCounts.d1++; dimCounts.d2++; dimCounts.d3++; dimCounts.d4++; }
      });
      if (reportEvals > 0) { totalScore += reportTotal/reportEvals; totalWeight++; evaluatorsCount += reportEvals; }
    });

    var avgScore = totalWeight > 0 ? totalScore/totalWeight : null;
    var hundredScore = avgScore !== null ? (avgScore/20*100).toFixed(1) : null;
    memberScores.push({
      member:member, reports:reportsForMember, avgScore:avgScore, hundredScore:hundredScore,
      dimAvg: { d1:dimCounts.d1>0?(dimScores.d1/dimCounts.d1).toFixed(2):null, d2:dimCounts.d2>0?(dimScores.d2/dimCounts.d2).toFixed(2):null, d3:dimCounts.d3>0?(dimScores.d3/dimCounts.d3).toFixed(2):null, d4:dimCounts.d4>0?(dimScores.d4/dimCounts.d4).toFixed(2):null },
      evaluatorsCount:evaluatorsCount
    });
  });

  memberScores.sort(function(a,b) {
    if (a.hundredScore===null && b.hundredScore===null) return 0;
    if (a.hundredScore===null) return 1; if (b.hundredScore===null) return -1;
    return parseFloat(b.hundredScore) - parseFloat(a.hundredScore);
  });

  var totalEvaluations = 0;
  Object.keys(scores).forEach(function(eid) { totalEvaluations += Object.keys(scores[eid]).length; });
  var evaluators = Object.keys(scores).filter(function(eid) { return Object.keys(scores[eid]).length > 0; }).length;

  var doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>物控科Q2复盘互评报告</title>' +
    '<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:40px;color:#333;max-width:1000px;margin:0 auto;}' +
    'h1{font-size:22px;color:#2563eb;border-bottom:2px solid #2563eb;padding-bottom:10px;}' +
    'h2{font-size:16px;color:#1e40af;margin-top:30px;}' +
    'table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}' +
    'th{background:#2563eb;color:#fff;padding:8px 10px;text-align:center;}' +
    'td{border:1px solid #ddd;padding:6px 10px;text-align:center;}td.name{text-align:left;font-weight:600;}' +
    'tr:nth-child(even){background:#f8fafc;}.section{margin-bottom:30px;}' +
    '@media print{body{padding:20px;}h1{font-size:18px;}table{font-size:10px;}}</style></head><body>';

  doc += '<h1>物控科 Q2 复盘互评报告</h1>' +
    '<div style="font-size:12px;color:#888;margin-bottom:20px;">生成：' + dateStr + ' | 参评：' + evaluators + '人 | 总评分：' + totalEvaluations + '次 | 报告：' + reportsData.length + '份</div>';

  doc += '<div class="section"><h2>综合排名(百分制)</h2><table><thead><tr><th>排名</th><th>姓名</th><th>类别</th><th>综合得分</th>' +
    '<th>事件描述</th><th>根因分析</th><th>解决方案</th><th>经验沉淀</th><th>获评次数</th></tr></thead><tbody>';

  memberScores.forEach(function(ms, idx) {
    if (ms.hundredScore === null) return;
    doc += '<tr><td>' + (idx+1) + '</td><td class="name">' + ms.member.name + '</td><td>' + ms.member.category + '</td>' +
      '<td style="font-weight:700;">' + ms.hundredScore + '</td>' +
      '<td>' + (ms.dimAvg.d1||'—') + '</td><td>' + (ms.dimAvg.d2||'—') + '</td><td>' + (ms.dimAvg.d3||'—') + '</td><td>' + (ms.dimAvg.d4||'—') + '</td>' +
      '<td>' + ms.evaluatorsCount + '</td></tr>';
  });

  doc += '</tbody></table></div></body></html>';

  var win = window.open('', '_blank');
  if (win) { win.document.open(); win.document.write(doc); win.document.close(); showToast('文档已打开，可Ctrl+P打印或Ctrl+S保存'); }
  else { var blob = new Blob([doc], {type:'text/html;charset=utf-8'}); var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href=url; a.download='物控科Q2互评报告.html'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); showToast('已下载'); }
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}
